<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop/dist/mobile-drag-drop.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @keyframes grow-in {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes fade-out {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: scale(0.9);
            }
        }
        .new-task-animation {
            animation: grow-in 0.3s ease-out;
        }
        .deleting-animation {
            animation: fade-out 0.3s ease-out forwards;
        }
        .dragging {
            opacity: 0.5;
            background-color: #f3f4f6;
        }
        html.dark .dragging {
            background-color: #374151;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-white font-sans transition-colors duration-300">

    <div id="login-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-900 dark:text-white">Enter Passphrase</h2>
            <input type="password" id="passphrase-input" class="w-full p-3 rounded bg-gray-200 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 dark:text-white" placeholder="••••••••••••" required>
            <button id="login-btn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition-colors duration-300">Login</button>
            <p id="login-error" class="text-red-500 text-sm mt-2 text-center h-5"></p>
        </div>
    </div>

    <div id="delete-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm transform transition-all">
            <h2 class="text-xl font-bold mb-4 text-center text-gray-900 dark:text-white">Confirm Deletion</h2>
            <p class="text-gray-700 dark:text-gray-300 text-center mb-6">Are you sure you want to delete this task?</p>
            <div class="flex justify-between space-x-4">
                <button id="cancel-delete-btn" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-md transition-colors duration-300">Cancel</button>
                <button id="confirm-delete-btn" class="w-1/2 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300">Delete</button>
            </div>
        </div>
    </div>

    <div id="app-container" class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 max-w-3xl hidden">
        <header class="flex lg:flex-row gap-4 flex-col justify-between items-center mb-8 pb-4 border-b border-gray-300 dark:border-gray-700 transition-colors duration-300">
            <div class="flex items-center gap-4">
                <h1 class="text-3xl font-bold text-blue-600 dark:text-blue-400">My Todo</h1>
                <button id="theme-toggle" class="text-gray-600 dark:text-gray-400 hover:text-blue-500 dark:hover:text-blue-300 transition-colors duration-300">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="logout-btn" title="Logout" class="text-gray-600 dark:text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition-colors duration-300 ml-2">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-4">
                <button id="prev-day" class="text-blue-400 hover:text-blue-300 transition-colors duration-300">
                    <i class="fas fa-chevron-left fa-lg"></i>
                </button>
                <input type="date" id="date-picker" class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-md p-2 border border-gray-300 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-300">
                <button id="today-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300">Today</button>
                <button id="next-day" class="text-blue-400 hover:text-blue-300 transition-colors duration-300">
                    <i class="fas fa-chevron-right fa-lg"></i>
                </button>
            </div>
        </header>

        <main>
            <div id="progress-container" class="mb-6 hidden">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Daily Progress</span>
                    <span id="progress-text" class="text-sm font-medium text-blue-600 dark:text-blue-400">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
            <ul id="todo-list" class="space-y-4">
                <!-- Tasks will be dynamically added here -->
            </ul>
            <div id="carry-over-container" class="mt-6 flex justify-center hidden">
                <button id="carry-over-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-md transition-colors duration-300 shadow-sm">
                    <i class="fas fa-share mr-2"></i>Carry Over Undone Tasks to Today
                </button>
            </div>
        </main>

        <footer class="mt-8">
            <div class="relative">
                <textarea id="task-input" class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white w-full rounded-md p-4 border border-gray-300 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-300" placeholder="Add a new task... (one per line for multiple tasks)" rows="3"></textarea>
                <div class="absolute bottom-4 right-4 flex space-x-2">
                    <select id="task-priority" class="bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white rounded-md px-3 border border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-300">
                        <option value="low">Low Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <button id="add-task-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300">Add Task(s)</button>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop/dist/mobile-drag-drop.min.js" onload="MobileDragDrop.polyfill()"></script>
    <script src="app.js"></script>
</body>
</html>
